<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulario de Contacto</h1>
  <form action="index.html">

    <label for="nombres">Nombres y Apellidos</label>
    <input type="text" id="nombres" name="nombres" />
    <br/>
    <label for="correo">Correo electronico: </label>
    <input type="text" id="correo" name="correo" />
    <br/>
    <label for="code">Código</label>
    <input type="number" id="code" name="code" />
    <br/>
    <label for="carrera">Selecciona tu carrera:</label>
    <select id="carrera" name="carrera">
      <option value="sistemas">Ing. Sistemas</option>
      <option value="mecatronica" >Ing. Mecatronica</option>
      <option value="civil">Ing. Civil</option>
    </select>
    <br/>
    <label for="radio">Nombre de Radio</label>
    <input type="text" id="radio" name="radio" />
    <br/>
    <input type="checkbox" id="check" name="check" value="yes">
    <label for="subscribe">Acepto los terminos y condiciones</label> 
    <br/>   
    <button type="submit">
      ENVIAR
    </button>
  </form>
</body>
</html>
